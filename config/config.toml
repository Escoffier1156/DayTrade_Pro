# =============================================================================
# デイトレード自動スクリーニング・通知システム 設定
#
# 原則:
#   - 判定に使う数値は例外なくこのファイルにある。コードに数値リテラルを置かない
#   - 各値の末尾コメントに仕様書の該当箇所を書く。仕様書と食い違う値には理由を書く
#   - 仕様書から変更した値は必ず [変更] と明記する
# =============================================================================

[system]
timezone   = "Asia/Tokyo"
dry_run    = true          # true の間は通知を送らずログにのみ出力する
log_level  = "INFO"        # DEBUG / INFO / WARNING / ERROR

[paths]
logs     = "logs"
data     = "data"
universe = "data/universe"
bars     = "data/bars"
state    = "data/state"
journal  = "data/journal"


# =============================================================================
# 立会時間（東証・2024年11月5日の取引時間延長後）
#   実測: 株探/J-Quants の1分足は 09:00-11:30(151本) + 12:30-15:24(175本)
#         + 15:30の引け1本 = 327本。15:25-15:29 はクロージング・オークション
# =============================================================================
[session]
morning_open          = "09:00"
morning_close         = "11:30"
afternoon_open        = "12:30"
afternoon_close       = "15:30"   # 大引け
closing_auction_start = "15:25"   # ここから板寄せ。継続的な1分足は出ない

# 昼休み（11:30-12:30）の扱い。仕様書に記述がないため実装側で定義する。
# true  = 「直近N分」「エントリー後N分」を立会時間ベースで数える（昼休みを含めない）
# false = 実時間で数える（昼休みをまたぐと N分前が前場になる）
elapsed_excludes_lunch = true


# =============================================================================
# 実行スケジュール（仕様書 第2章）
# =============================================================================
[schedule]
premarket_batch = "15:45"   # 前日バッチ。[変更] 仕様書15:30 → J-Quantsの日足更新が16:30頃のため
                            #                実際の起動は run_batch の retry_until まで待つ
batch_retry_until = "23:00" # 16:30頃の更新を待って成功するまで再試行する終了時刻
hotlist_build   = "08:00"   # ホットリスト構築（仕様書 8:00〜9:00）
hotlist_refresh = "09:25"   # [追加] 8:00以降に出た材料を拾うための再圧縮
regime_judge    = "08:45"   # 地合い判定（仕様書 8:45）
monitor_start   = "09:00"   # 監視開始（仕様書 9:00）
screen_judge    = "09:30"   # 第1層・第2層判定（仕様書 9:30）
stop_switch     = "09:45"   # 損切り 1.5ATR → 0.7ATR（仕様書 9:45）
force_exit      = "15:20"   # [変更] 仕様書14:55 → 大引け15:30・オークション15:25開始の5分前
daily_report    = "15:40"   # [変更] 仕様書15:15 → 15:15は場中のため大引け後に移動


# =============================================================================
# 第0層: ユニバース確定（仕様書 第3章）  前日バッチ / 日足のみ
# =============================================================================
[layer0]
require_margin_loan       = true          # 貸借銘柄必須
exclude_margin_restricted = true          # 増担保・日々公表・信用規制がすべてなし

# 対象とする商品区分（J-Quants master.ProdCat）。実データで同定した対応:
#   011 内国株(3,897) / 012 特殊法人(2) / 013 REIT(63)
#   014 ETF・ETN(421) / 021 外国株(5) / 023 外国ETF(56)
# ETF・REIT も貸借銘柄になっているが、ATR比率3%やILLIQの前提は個別株向けのため既定は内国株のみ。
allowed_product_categories = ["011"]

# 対象とする市場区分（J-Quants master.Mkt）。実データで同定した対応:
#   0111 プライム(1,557) / 0112 スタンダード(1,563) / 0113 グロース(598)
#   0109 その他=ETF/REIT(540) / 0105 TOKYO PRO MARKET(186)
# TOKYO PRO MARKET は特定投資家向けで個人の信用取引ができないため除外する。
allowed_markets = ["0111", "0112", "0113"]

# 信用区分（J-Quants master.Mrgn）。1=信用(1,561) / 2=貸借(2,674) / 3=その他(209)
margin_loan_class = "2"

price_min = 800                           # 円
price_max = 3000                          # 円（非TOPIX500）
# TOPIX500構成銘柄は呼値が細かいためティックコストが半分。下限を緩和する。
# 仕様書は「TOPIX100」と書いているが、東証の呼値細分化の対象はTOPIX500構成銘柄。
# J-Quants の ScaleCat（TOPIX Core30/Large70/Mid400/Small）で判定する。
price_min_relaxed        = 600

# 株価上限も TOPIX500 では緩める。下限を緩めているのと同じ論理。
#
#   仕様書 第3章の根拠「1ティック=1円で0.125%、往復0.25%が固定コスト」を
#   呼値表で検算すると、上限3,000円は「非TOPIX500 で呼値が 1円→5円 に跳ぶ点」に
#   正確に対応している（3,001円の往復は 0.333% で、下限800円の 0.250% より高い）。
#   一方 TOPIX500 は 10,000円まで呼値1円のままで、
#     5,000円 → 往復 0.040%   10,000円 → 往復 0.020%
#   下限800円の 0.250% の 1/6〜1/12 でしかない。
#
#   [変更] TOPIX500 のみ上限を 5,000円 にする。ユニバースは 60 → 105銘柄（1.76倍）。
#
#   10,000円にしない理由はティックコストではなく株数の粒度。
#   出口ルールが +1R で 1/3 利確という分割決済を前提にしている:
#     株価 1,500円 → 1,600株（16単元）  1/3利確 500株
#     株価 5,000円 →   500株（ 5単元）  1/3利確 100株  ← 粗いが成立
#     株価 9,149円 →   200株（ 2単元）  1/3利確  66.7株 → 分割不能
#   さらに高額株は株数の最初の2項（リスク基準・集中回避）で絞られるため、
#   第3項の流動性基準（板厚の代替）が一度も律速にならない。
#   実測: 株価3,450円以上ではすべて risk が律速で、liquidity は効かなかった。
#
#   分割決済のルールを「一括利確＋トレールのみ」に変えるなら、
#   10,000円の議論を再開できる。そのため設定で切替可能にしてある。
price_max_relaxed        = 5000
relaxed_scale_categories = ["TOPIX Core30", "TOPIX Large70", "TOPIX Mid400"]

avg_turnover_20d_min_yen = 3_000_000_000  # 30億円。この層の流動性の主条件
atr_ratio_min_pct        = 3.0            # ATR(14) ÷ 株価。出口ロジックに直結するため動かさない

# アミハッド非流動性指標の上限。
#
# [修正] 仕様書の 0.04 から 0.15 に変更した。緩和ではなく、明示条件と暗黙条件が
#        衝突していたことの修正。経緯:
#
#   ILLIQ の定義を展開すると
#       ILLIQ ≒ mean|日次リターン%| ÷ 売買代金(億円)
#       mean|日次リターン%| ≒ 0.5〜0.6 × ATR比率     （実測: ATR3〜4%帯で 0.57）
#   となり、ILLIQ の上限は「売買代金の下限」を暗黙に定めている。
#
#   ATR比率別に、ILLIQ 0.04 が実効的に要求していた売買代金（実測）:
#       ATR 3〜4%  → 50億   ATR 4〜6%  → 67億   ATR 6%〜  → 111億
#
#   いずれも明示条件の 30億 を上回るため、0.04 のもとでは
#   avg_turnover_20d_min_yen が一度も機能していなかった（5億〜40億のどこに
#   動かしても結果が1銘柄も変わらないことを実測で確認）。
#
#   さらに ATR比率が高いほど分子が大きくなるため、ILLIQ は
#   「よく動く銘柄ほど厳しく罰する」形で条件5と正面衝突していた。
#   結果として第0層の確定数は 22 銘柄まで落ちていた。
#
#   0.15 は「30億条件を上書きしない」水準から逆算した値:
#       ATR比率 3.5%（ユニバース中央値）→ mean|リターン| ≒ 2.0%
#       2.0 ÷ 30億 ≒ 0.067 … ATR 5〜6% の銘柄まで 30億で通すには更に余裕が要る
#
#   0.15 にした結果（実測5営業日: 52 / 55 / 65 / 68 / 55 銘柄）、
#   通過銘柄の売買代金の最小値がちょうど 30億 に着地し、52銘柄中20銘柄が
#   50億未満になった。30億の条件が律速に戻ったことの確認になっている。
#
#   これで ILLIQ は「30億を通ったうえで、明らかに値が飛ぶ銘柄だけを落とす」
#   という本来の役割に戻る。
#
# 詳細: docs/01_layer0_findings.md
illiq_max                = 0.15

# --- ILLIQ の二段構え（レジーム変化の救済）---
#
# ILLIQ(20日) は流動性のレジーム変化に遅れる。実測例（2026-08-24 / 5985 サンコール）:
#   7/27〜8/10 … 売買代金 5〜17億。20.69% を 9億 で動いた日があり比 2.32
#   8/12〜     … 売買代金 45〜90億。比は 0.02〜0.26 に改善（日本ケミコンと同等）
#   20日平均は両者の平均 32億、ILLIQ 0.3758 で脱落
#
# 8/12以降の状態は、第2層1番「出来高急増率2倍以上」が探しているものそのもの。
# 「昨日まで薄かった」ことを理由に今日火がついた銘柄を第0層で捨てると、
# デイトレの前提（新しく流動化した銘柄を拾う）と噛み合わない。
#
# そこで次のどちらかを満たせば通過とする。
#   (a) 通常     : ILLIQ(20日) <= illiq_max
#   (b) レジーム : ILLIQ(直近5日) <= illiq_max
#                  かつ 直近5日平均売買代金 >= 20日平均売買代金 × 2.0
#
# (b) は救済であって緩和ではない。「最近5日で見れば流動性は十分」かつ
# 「直近が明確に厚くなっている」の両方を要求するので、単に薄い銘柄は通らない。
# (b) で通った銘柄には印が付き、ログで通常通過と分けて集計される。
illiq_regime_rescue_enabled = true
illiq_recent_period         = 5     # 直近何日で ILLIQ を測り直すか
illiq_regime_turnover_ratio = 2.0   # 直近5日平均 ÷ 20日平均 がこの倍率以上
illiq_recent_min_valid_days = 4     # 直近5日のうち売買代金がある日がこれ未満なら救済しない

# 急増率を測るときの分母。
#   "prior15" … 直近5日を除いた過去15日の平均（既定）
#   "full20"  … 20日平均
#
# [要判断] full20 には構造的な弱点がある。急増が続くと20日平均自体が押し上げられ、
#          比が縮む。実測（2026-08-24）:
#
#   銘柄            20日    5日   前15日  full20比  prior比  判定
#   4392 ＦＩＧ      59億  149億   29.0億   2.53     5.14   どちらでも救済
#   5985 サンコール   32億   57億   23.7億   1.78     2.41   full20では脱落
#   4022 ラサ工業    31億   24億   33.3億   0.77     0.72   どちらでも脱落
#
#          サンコールは8/12から9営業日流動化しており、20日平均32億にその9日分が
#          既に入っている。ILLIQ(5日) は 0.0823 で流動性は十分なのに、分母が
#          汚染されて比が 1.78 に落ちる。この救済規則を導入する動機になった
#          銘柄そのものが、full20 では救済されない。
#
#          prior に変えるとサンコールは 2.41 で救済され、ラサ工業は 0.72 で
#          脱落したまま。判別としては prior のほうが正しく働く。
#
#          [変更] 既定を prior15 にした。full20 は設定に残してある。
#                 53→54銘柄になり、意図した銘柄（5985 サンコール）が救済され、
#                 4022 ラサ工業は 0.72 で正しく脱落したまま。
illiq_regime_baseline = "prior15"

atr_period          = 14
avg_turnover_period = 20
illiq_period        = 20

# ATR の平滑化方法。仕様書は「ATR(14)」としか書いておらず定義が2通りある。
#   "wilder" … Wilder の平滑化。ATR の原典の定義で、主要なチャートツールの既定
#   "sma"    … 直近N本の True Range の単純平均
# wilder は過去を指数的に引きずるため値が滑らかで、sma は直近N本だけを見る。
# 同じ銘柄でも数%ずれるため、バックテストと本番で必ず同じ方法を使うこと。
atr_method = "wilder"

# ILLIQ が売買代金の明示条件を上書きしていないかを起動時に検査するための係数。
#   mean|日次リターン%| ≒ ret_to_atr_ratio × ATR比率
# 実測値（2026-08-24 / 株価800-3,000円・貸借・規制なしの1,087銘柄）:
#   ATR 3〜4%帯で mean|ret| 2.01% → 比 0.57
# この係数から
#   ILLIQ が暗黙に要求する売買代金 = (係数 × atr_ratio_min_pct) ÷ illiq_max  [億円]
# を求め、avg_turnover_20d_min_yen を超えていたら設定の矛盾として起動時に落とす。
# 仕様書の 0.04 では 42.8億 > 30億 となり、明示条件が死んでいた。
ret_to_atr_ratio = 0.57

# ILLIQ が売買代金の明示条件より厳しくなり始める ATR比率（律速の入れ替わり点）:
#     crossover_ATR = illiq_max × (avg_turnover_20d_min_yen / 1億) ÷ ret_to_atr_ratio
# 現行値では 0.15 × 30 ÷ 0.57 = 7.9%。
# つまり ATR比率 7.9% を超える銘柄に対しては、ILLIQ が今も30億を上書きしている。
# これは「ILLIQを軽い最終フィルタとして残す」という意図に沿った挙動だが、
# 交点が低すぎると高ボラ帯（第2層で最も加点されやすい帯域）を第0層で削ることになる。
# 交点がこの値を下回ったら起動時に警告する。
illiq_crossover_atr_warn_pct = 6.0

# ILLIQ の計算で、売買代金がゼロの日は除外する。
# 有効な日数がこれを下回る銘柄は ILLIQ を計算できないものとして落とす。
illiq_min_valid_days = 15

# 日足の取得本数。ATR(14) は前日終値を使うため period+1 本、余裕をみて多めに取る
lookback_trading_days = 40


# --- 信用規制による除外（J-Quants /markets/margin-alert の PubReason）---
# 公式のフラグ定義:
#   Restricted          東証が定める信用取引の規制措置銘柄（増担保）
#   DailyPublication    東証が定める日々公表銘柄
#   Monitoring          東証が定める特別注意銘柄
#   RestrictedByJSF     日本証券金融が定める貸株申込制限措置銘柄
#   PrecautionByJSF     日本証券金融が定める貸株注意喚起銘柄
#   UnclearOrSecOnAlert 不明確情報等により注意喚起の対象となった銘柄
#
# 仕様書 第3章が名指しするのは「増担保・日々公表・信用規制」の3つだが、
# 意図が「規制＝流動性枯渇リスク」である以上、日証金の規制・注意喚起も同じリスクとみなす。
# PrecautionByJSF は該当が最も多い（2026-08-24 時点で95銘柄）ため、
# ユニバースが痩せすぎる場合はここを false にして調整する。
[layer0.margin_alert_exclude]
Restricted          = true
DailyPublication    = true
Monitoring          = true
RestrictedByJSF     = true
PrecautionByJSF     = true
UnclearOrSecOnAlert = true


# =============================================================================
# ホットリスト（仕様書 第2章 8:00〜9:00「ホットリストへ圧縮」）
#
# 仕様書はユニバース200〜300銘柄を30〜50銘柄へ圧縮する前提だったが、
# 実測では第0層の確定数は 52〜68 銘柄（docs/01_layer0_findings.md）。
# 圧縮先の想定サイズとほぼ同じであり、ここで絞る意味がない。
#
# 圧縮は「朝の時点で人が選ぶ」ことに相当し、選択バイアスを持ち込む。
# ユニバースが十分小さいなら圧縮せず全銘柄を監視するほうが健全。
# =============================================================================
[hotlist]
# ユニバースがこの銘柄数以下なら圧縮せず全銘柄を監視対象にする
skip_compression_if_universe_at_most = 80
# 圧縮する場合の上限銘柄数
max_symbols = 50


# =============================================================================
# 第1層: 欠格条件（仕様書 第4章）  5個中5個必須 / 判定は9:30
# =============================================================================
[layer1]
require_all = true

# 2. 寄り後30分の売買代金
turnover_since_open_min_yen = 1_000_000_000   # 10億円
turnover_since_open_window_min = 30

# 3. 直近5分の売買代金
turnover_recent_min_yen = 150_000_000         # 1.5億円
turnover_recent_window_min = 5

# 4. 売買代金の継続性
#
# [修正] 仕様書の 3,000万 から 2,000万 に変更した。緩和ではなく、
#        条件3が数学的に発火不能だったことの修正。
#
#   条件4は「直近10分の各1分足が床以上」を要求する。直近5分は直近10分の部分集合
#   なので、条件4が成立すれば直近5分の合計は必ず「床 × 5」以上になる。
#       3,000万 × 5分 = 1.5億 = turnover_recent_min_yen
#   つまり条件4を満たした時点で条件3は自動的に成立し、条件3は独立に発火できない。
#   ILLIQ 0.04 と同じ「死んだ条件」だった（docs/01_layer0_findings.md と同型の誤り）。
#
#   2,000万にすると 2,000万 × 5分 = 1億 < 1.5億 となり、両方が独立に効く。
#   「5分平均は足りているが、途中に2,000万を割る分足がある」銘柄を条件4が拾えるようになる。
#
#   2つの条件は本来別のものを見ている:
#     条件3 = 瞬間流動性（今この瞬間、逃げられる量が流れているか）
#     条件4 = 継続性（累計値が寄りの数分に集中していないか）
#   継続性の床は、瞬間流動性の要求水準より低くなければ独立に機能しない。
#
# この含意関係は起動時の検証で機械的に検査される（config.py の _check_implications）。
continuity_window_min          = 10
continuity_bar_min_yen         = 20_000_000   # 各1分足で2,000万円以上
#
# [削除] 「ゼロ約定の足は0本」は判別力が不足していたため条件から外した。
#        実測（5営業日・母数299）でゼロ約定を含む銘柄は 3 件（1.0%）。
#        第0層で20日平均売買代金30億以上に絞った時点で、9:20〜9:30 に約定が
#        飛ぶ銘柄はほぼ残らない。床2,000万の条件は236件で発火しており、
#        継続性の判定は床だけで機能している。
#        条件を1つ増やす保守コストに見合わないため削除した。
#        （7071 アンビスHD のような銘柄は第0層で落ちるため、この条件が
#          本領を発揮する場面は第0層より前にしかない）

# 5. ティック連続性
tick_continuity_window_min   = 10
tick_continuity_max_gap_ticks = 2             # 始値と前足終値の乖離
tick_continuity_min_ok_bars   = 9             # 10本中9本以上


# =============================================================================
# 第2層: 加点条件（仕様書 第5章）  5個中4個以上で候補入り
# =============================================================================
[layer2]
# [変更] 5個中4個 → 4個中3個。3番「ATR比率3%以上」を削除したため（下記）。
# [変更] 4個中3個 → 3個中2個。材料条件を一時的に外したため。
#
#   材料は現状ほぼ機能していない（TDnet由来0件、通過分は全てセクター連動）。
#   セクター連動は銘柄を判別せず日別で 16/38/72/40/4 と一括で上下し、
#   候補数の分散を増やしていた。株探で当日朝の開示を取れるまで外す。
#
#   条件を1つ減らすなら required も比例して下げないと実効的な厳しさが変わる。
#     5個中4個(80%) → 4個中3個(75%) → 3個中2個(67%)
#   材料が機能していない現状は実質「3個中3個(100%)」で回っていたので、
#   67%への変更は緩和ではなく実効値を設計値に戻す修正。
#
#   株探実装後に材料を戻すときは 4個中3個 に戻すこと。
required_count      = 2    # 2個以上 → 候補入り
strong_count        = 3    # 3個すべて → 主力候補

# 1. 出来高の相対水準（同時間帯の平年比）
#
# [改名] 仕様書は「出来高急増率」だが、採用した閾値 0.5σ が測っているのは
#        「異常な出来高」ではなく「平年並みより多い出来高」。
#        出来高分布は右に歪む（歪度 +1.14）ため 0.5σ が上位22%にあたる。
#          元の意図: 今日その株に人が集まっているか（異常検知）
#          現在の実体: 今日の出来高が平年並みより多いか（順位付け）
#        第2層は加点条件なので順位付けとして機能すれば足りるが、
#        名前と中身がずれると後から読んだときに誤解するため実体に合わせた。
volume_activity_ratio_min   = 2.0
volume_activity_bonus_ratio = 3.0    # 3倍以上で
volume_activity_bonus_points = 2     # +2点（急増率のみ加重）

# 急増率の分母の取り方。
#   "same_window" … 過去20営業日の「同じ時間帯までの累計出来高」の平均（推奨）
#   "full_day"    … 20日平均の1日ぶん出来高
#
# [修正] full_day は判定時刻が9:30のとき数学的に発火しない。
#        実測（2026-08-24 / ユニバース53銘柄）:
#          9:30時点の出来高は1日の中央値 19.6% しか流れていない
#          当日累計 ÷ 20日平均(1日分) = 中央値 0.13倍 / 最大 0.38倍
#          2.0倍に達するには1日換算で 10.2倍 の出来高が必要
#          → 5営業日で 0/299 銘柄。一度も発火しない
#
#        same_window で測り直すと（サンプル12銘柄）:
#          当日9:30まで ÷ 過去20日の9:30まで平均 = 0.47〜1.15倍（中央値 0.67倍）
#          条件が意味を持つ範囲に入る
#
#        30分ぶんを1日ぶんと比べていたのは単位の取り違えであり、
#        仕様書の値ではなく実装の誤り。既定を same_window にする。
volume_activity_baseline = "same_window"

# 急増率の閾値の決め方。
#   "fixed"  … volume_activity_ratio_min の固定値
#   "tiered" … 20日平均売買代金の水準で段階化（下の volume_activity_tiers）
#   "zscore" … 過去20日の同時間帯出来高の平均と標準偏差から (当日-μ)/σ で判定
#
# [変更] fixed の 2.0倍 は売買代金の絶対水準に対して中立でない。
#        ソフトバンクG（20日平均 2,402億）が同時間帯比 2.0倍になるには
#        その日に約2,400億の追加需要が要り、決算やTOPIX入替でしか起きない。
#        実測でも株価上限を緩めて大型株が入った結果、通過率が 12% → 6% に落ちた。
#        ILLIQ 0.04 が ATR比率に対して中立でなかったのと同じ構造。
#        [決定] zscore を採用。理由:
#          - 定数が2つ（閾値とσ/μ下限）で済む。tiered は6つ（境界2・比率3・帯の切り方）
#          - 階段状の不連続がない
#          - 同じ通過率で比べたとき帯域間のばらつきが小さい
#              通過率14%のとき  tiered 13.1pt / zscore 7.6pt
volume_activity_mode = "zscore"

# zscore のときの閾値。(当日出来高 - 平均) / 標準偏差
#
# [変更] 2.0 → 0.5。実測でチューニングした。
#
#   出来高の分布は右に歪む（歪度 +1.14）ため、正規分布の感覚が当てはまらない。
#   実測（5営業日・129銘柄日）では
#     2.0σ = 上位 2%   1.0σ = 上位 14%   0.6σ = 上位 20%   0.5σ = 上位 22%
#   目標の通過率20〜30%に対して 0.5σ が帯の中央。
#
#   閾値ごとの候補数（1日平均 / 3銘柄以上の日）:
#     2.0σ  3.8 / 3日    1.0σ  5.2 / 3日    0.5σ  6.4 / 3日    0.4σ  7.0 / 3日
#   3銘柄以上の日数は閾値によらず変わらない（08-21・08-24 は第1層通過が
#   17・23 と薄く、急増率を緩めても届かない）。
#
#   緩める方向の判断は根拠を作りにくいため、目標帯の中央を採って
#   多すぎたら締める方針とした。
volume_activity_zscore_min = 0.5
# 標準偏差が平均に対してこの割合を下回ると z が発散するため、その場合は判定しない
volume_activity_zscore_min_cv = 0.05
# zscore のとき、閾値のこの倍率を超えたら加点する
volume_activity_zscore_bonus_multiple = 1.5


# same_window の基準を作る前日バッチの設定
volume_profile_lookback_days = 20

# 2. 当日値幅率 (高値-安値)÷始値
#
# [変更] 下限 3.0% → 2.5% / 上限 15.0% → 8.0%
#
#   元の 3.0〜15% は「1日を通しての値幅」を想定した数字で、9:30 時点に
#   適用したのは単位の取り違え（出来高急増率と同じ種類の誤り）。
#
#   下限は実測分布から決めた（5営業日・299件の 9:30 時点の値幅率）:
#     p50 1.99% / p60 2.28% / p65 2.46% / p70 2.53% / p90 3.68% / 最大 9.97%
#   目的は「上位30〜40%が通る水準」。p65（上位35%）が 2.46% なので 2.5% を採用。
#     下限2.5% + 上限8.0% → 93/299（31.1%）が通過
#
#   上限は 9:30 時点で 8% 動いている銘柄が大引けまでに15%を超える可能性が
#   高いため 8.0%。実測では 9:30 時点で 8% 超は 2/299 件。
day_range_pct_min = 2.5
day_range_pct_max = 8.0

# 3. ATR比率 —— [削除]
#
#    第0層の「ATR(14)÷株価 3.0%以上」と同一条件だったため、第0層通過銘柄は
#    定義上100%満たしていた（実測でも53/53が通過）。通過率100%の条件は
#    required を実質1つ下げているのと同じで、判別力がゼロ。
#
#    当日ATRに置き換える案は採らない。当日ATRは条件2（当日値幅率）と
#    ほぼ同じものを見ることになり、別の重複を作るだけになる。
# 4. VWAPより上（現在値 > VWAP）
require_above_vwap = true

# 5. 材料・テーマ性（決算・適時開示・セクター連動のいずれか）
# [一時無効] 株探で当日朝の開示を取れるようになるまで第2層から外す。
#            復帰時は required_count を 3 に戻すこと。
material_enabled = false

# 材料の判定に使う適時開示の種別。TDnet の Title に対する正規表現。
# 株主総会招集通知や役員異動のような定例開示は材料に数えない。
# tiered の段階。max_turnover_oku 以下ならその ratio。最後は上限なし。
# 大型株ほど絶対額での需要増が難しいので閾値を下げる。
# 「20日平均比で何倍か」ではなく「その銘柄にとって異常な出来高か」を測るのが本来の意図。
# （配列テーブルは [layer2] のスカラーを全て書いた後に置くこと。
#   途中に置くと以降のキーがサブテーブル側に入ってしまう）
[[layer2.volume_activity_tiers]]
max_turnover_oku = 100
ratio = 2.0

[[layer2.volume_activity_tiers]]
max_turnover_oku = 500
ratio = 1.5

[[layer2.volume_activity_tiers]]
ratio = 1.3


# TOML のベアキーは ASCII のみなので、日本語のキーは引用する
[layer2.material_patterns]
"決算"         = "決算短信|四半期決算|決算説明"
"業績修正"     = "業績予想.*(修正|見直)|通期業績予想|上方修正|下方修正"
"配当"         = "配当予想.*(修正|変更)|増配|復配|記念配当"
"自己株式"     = "自己株式.*(取得|消却)"
"資本業務提携" = "業務提携|資本提携|合弁|アライアンス"
"M&A"          = "株式取得|子会社化|吸収合併|株式交換|公開買付|事業譲渡|TOB"
"新規事業"     = "新製品|新工場|大型受注|契約締結|供給開始|承認取得|特許"
"株式分割"     = "株式分割"

[layer2.material]
# 適時開示をどの時間帯まで拾うか。
# J-Quants は 16:30 更新なので、前日バッチでは「前営業日の全開示」が取れる。
# 引け後(15:00〜)の開示は翌日の寄りに効くため、これを当日の材料として扱う。
prev_day_from_time = "15:00"
# 当日の決算発表予定があれば材料とみなす
use_earnings_schedule = true
# セクター連動: 所属33業種の前日の中央値騰落率がこの絶対値以上なら材料とみなす
sector_move_pct = 2.0
# [無効化] セクター連動は銘柄を判別せず、その日の候補数を一括で上下させるだけだった。
#          実測（2.0%閾値）: 日別の該当数 16 / 38 / 72 / 40 / 4
#          08-20 は 111銘柄中72件（65%）が該当。候補数の分散を増やしていた。
enable_sector = false
# 訂正開示は材料に数えない
exclude_correction_pattern = "^（訂正|^\\(訂正"


# =============================================================================
# 第3層: 執行条件（仕様書 第6章）  3個中3個必須
# =============================================================================
[layer3]
vwap_deviation_min_pct   = 0.0    # 0〜+3% でエントリー
vwap_deviation_max_pct   = 3.0
vwap_deviation_chase_pct = 5.0    # +5%超は飛び付き。押し目待ちへ
min_risk_reward          = 2.0    # 1:2 以上


# =============================================================================
# 株数計算（仕様書 6-2）  3制約の最小値
# =============================================================================
[sizing]
total_capital_yen            = 10_000_000   # 総資金 1,000万円
risk_per_trade_pct           = 1.0          # 総資金の1%
# 1銘柄配分上限 250万円。
# [理由を改訂 2026-08-25] 旧: 「集中を避けるため」
#   新: **4銘柄 × 250万 = 1,000万 = 総資金100%。現物では上げる余地が無い。**
#   300万に上げると3銘柄しか建てられず、§10の「下限3銘柄」に張り付く。
#   1R を実績MFEベース（株価の0.76%）にした結果、株数の律速は risk から
#   concentration に移り（実測 79%）、1トレードのリスク実額は資金の約0.19%になる。
#   これは制約であって選択ではない。詳細: docs/05_r_scale_measurement.md §3
max_per_symbol_yen           = 2_500_000
liquidity_pct_of_5min_volume = 1.0          # 直近5分の出来高の1%
lot_size_default             = 100          # 単元株数の既定値。銘柄別に上書きされる
# 分割決済（+1R で partial_take_fraction 利確）が成立するために必要な最小単元数。
# 1/3 利確なら 3単元。これを下回る株価帯はユニバースに入れてはいけない。
# 起動時に price_max_relaxed と突き合わせて検査する。
min_units_for_partial_take = 3
# [要判断] max_per_symbol_yen 250万 × 強気時の最大5銘柄 = 1,250万 で総資金1,000万を超える
#          （建玉率1.25倍）。第0層が貸借銘柄を必須とする以上、信用取引口座が前提と読める
#          ため true にしている。現物のみの運用なら max_per_symbol_yen を200万に下げること。
#          詳細: docs/00_recon.md 指摘G
acknowledge_leverage = true


# =============================================================================
# 損切り・R の定義（仕様書 第7章）
# =============================================================================
[stops]
# [変更 2026-08-25] 1R の尺度を「日足ATR」から「同時刻からの実績MFE」へ。
#
#   旧: 1R = 1.5 × ATR(14)【日足】 → 株価の 5.79%（中央値）
#       9:30 に建てて大引けまで持っても +1R にも −1R にも到達率 0.0%
#       出口ラダー（+1R/+1.5R/+2R/+3R）と初期損切りが**両方とも死んでいた**
#   新: 1R = 0.7 × 過去20営業日の「同時刻からの最大有利変位」の中央値
#       → 株価の 0.76%。+1R 到達 56% / +2R 到達 24〜29%（3時刻で安定）
#
#   根拠: docs/05_r_scale_measurement.md（第0層 1,094 銘柄日）
r_scale_source   = "mfe_profile"   # mfe_profile | daily_atr（旧方式に戻す用）
r_scale_multiple = 0.7             # 実測: 0.7 と 0.8 が目安内。0.7 が中央
#
# ★重要★ r_scale_source = "mfe_profile" のとき、以下の倍率が掛かる相手は
# 「日足ATR」ではなく **1R そのもの** になる。値は変えていないが意味が変わる。
#   atr_multiple_late 0.7  → 9:45 に損切りを **−0.7R** へ引き上げ
#   トレールの ATR倍率      → **Rの倍数**として読む（0.8R / 加速時 0.5R）
# 日足ATRのままだとトレール線が 5R 以上離れ、やはり一度も作動しない。
atr_multiple_early = 1.5     # daily_atr のときのみ使う（9:00〜9:45 エントリー）
atr_multiple_late  = 0.7     # 9:45 の引き上げ幅。mfe_profile では R の倍数
switch_time        = "09:45" # 既存ポジの損切りもこの時刻に引き上げ

# ラチェット: 一度上げた線は絶対に下げない。バグると建値割れが起きる
ratchet_only_up = true

# 1R の定義。仕様書は「1R = 初期損切り幅」とのみ記す。
# true  = エントリー時点の初期損切り幅で固定（9:45の引き上げ後もRは変わらない）
# false = 現在の損切り幅で都度再計算
# 固定でないと +1R/+1.5R/+2R のトリガと日次 -3R/+5R のカウントが途中で意味を変える
r_fixed_at_entry = true


# =============================================================================
# 出口ルール（仕様書 第8章）
# =============================================================================
[exits]
no_trail_minutes      = 15      # エントリー後15分は初期損切りのみ。トレール発動なし

partial_take_r        = 1.0     # +1R で
# [修正] 元は 0.3333 だったが、単元への丸めを切り捨てにしていたため
#        300株 × 0.3333 = 99.99 → 0株 となり分割決済が消えていた。
#        1/3 は2進小数で正確に表せないので、定数の桁を増やしても解決しない。
#        丸めを四捨五入に変え（engine/layer3.py の partial_take_shares）、
#        最低1単元は利確し、残りも最低1単元は残すようにした。
partial_take_fraction = 0.3333
breakeven_r           = 1.5     # +1.5R でストップを建値へ
trail_start_r         = 2.0     # +2R でトレール開始
accelerate_r          = 3.0     # +3R超で加速

time_stop_minutes = 30          # エントリー後30分で
time_stop_min_r   = 0.5         # +0.5R 未満なら成行撤退

daily_loss_limit_r        = -3.0  # -3R 到達でその日は強制終了
daily_accelerate_r        = 5.0   # +5R 到達で
daily_accelerate_factor   = 0.5   # 株数を半分に落として継続（利確はしない）
consecutive_loss_count    = 2     # 2連敗で
cooldown_minutes          = 30    # 30分クールダウン

# 部分利確を日次Rにどう積むか。仕様書に定義がないため実装側で定義する。
# "weighted" = 建玉比率で加重（1/3を+1Rで利確 → +0.333R）
# "full"     = 到達したR倍数をそのまま加算（+1R）
# weighted でないとサーキットブレーカーが実際のリスク量とずれる
partial_r_accounting = "weighted"

# --- トレール線（仕様書 第8章「トレール線の定義」）---
#   トレール線 = max( 直近N分安値 - offset_ticks, VWAP )
#   更新 = 1分足確定ごと / ラチェットあり
[exits.trail]
offset_ticks = 1       # 直近N分安値から1ティック下
floor_vwap   = true    # VWAP を下限として max を取る

# 時間帯別の設定。until は「その時刻まで」。最後の1つは until を省略し終端まで適用。
# [変更] 第3段の開始を仕様書14:00 → 14:30。大引けが15:00→15:30に延びたため
#        「大引け前1時間」という設計意図を保つ
#
# ★単位★ mode="atr" の atr_multiple が掛かる相手は、stops.r_scale_source が
#   "mfe_profile" のとき **1R**、"daily_atr" のとき **日足ATR**。
#   仕様書§8 も「0.8 × R 幅」に表記を揃えた（2026-08-25）。
#   キー名は履歴として atr_multiple のままだが、意味は R の倍数。
#   日足ATRのままにするとトレール線が5R以上離れ、一度も作動しない。
[[exits.trail.phases]]
until     = "10:30"
mode      = "atr"      # 現在値から atr_multiple × R 下（§8「0.8 × R 幅」）
atr_multiple = 0.8

[[exits.trail.phases]]
until      = "14:30"   # [変更] 仕様書 14:00
mode       = "low"     # 直近 window_minutes の安値
window_minutes = 10

[[exits.trail.phases]]
mode       = "low"
window_minutes = 3

# +3R超の加速時はフェーズによらずこの幅（§8「0.5 × R 幅」）
[exits.trail.accelerate]
mode         = "atr"
atr_multiple = 0.5


# =============================================================================
# 決済判定の粒度（仕様書 第14章の未確定事項）
#   A = 1分足終値のみ / B = 15秒ティックで即決済 / C = 折衷
#   C を採用: 実測で下ヒゲ>0.3%の1分足は10.0%（下ヒゲありは67.7%）。
#             B の誤爆を約85%削り、A の遅延リスクを大きい割れだけ潰す
# =============================================================================
[exit_decision]
mode = "C"

# C のときのみ使用。ティックがトレール線をこの割合以上下回ったら1分足を待たず即決済
break_threshold_pct = 0.3

# break_threshold の測り方
#   "pct" = トレール線に対する固定%（仕様書の定義）
#   "atr" = ATR に対する倍率（価格帯によるティック数のばらつきを吸収する代替案）
break_threshold_basis = "pct"
break_threshold_atr_multiple = 0.1   # basis="atr" のときのみ使用


# =============================================================================
# 撤退シグナル（仕様書 第9章）  トレールより優先
# =============================================================================
[exit_signals]
warn_count        = 1   # 1つ点灯 → 撤退検討（通知のみ）
force_exit_count  = 2   # 2つ点灯 → トレール線を無視して即成行

# 売買代金の急減: 直近3分が寄り後30分平均の30%以下
turnover_drop_window_min    = 3
# [変更] 分母を「その日の寄り後30分平均」から「同じ経過分の過去N営業日の中央値」へ。
#   旧方式は寄り付きの出来高集中が分母を押し上げ、平常時の比の中央値が 0.189、
#   閾値0.30以下が 76.8% と、平常を急減と判定していた（実測・10営業日）。
#   新方式では比の中央値 1.462 / 閾値0.30以下が 0.9%。**閾値 0.30 は据え置き。**
#   遡る営業日数は layer2.volume_profile_lookback_days を流用する（同じ分足を使うため。
#   ここに別の日数を置くと二重管理になり、片方が死ぬ）。根拠 docs/04_phase6_findings.md
turnover_drop_ratio         = 0.30
# 分母（寄り後30分平均）が未確定のときはシグナルを発火させない。
# 0除算やゼロ分母で常時点灯するのが最悪の壊れ方。
# また後場の開始直後は「直近3分」が昼休みをまたいで前場の足になるため、
# 後場開始からこの分数のあいだは判定しない。
afternoon_grace_minutes     = 3

# 実質スプレッド拡大: 1分足で2ティック以上の窓が2本連続
spread_gap_ticks            = 2
spread_gap_consecutive_bars = 2

# VWAP割れ: 仕様書は「2分足で確定」だが株探・J-Quants とも2分足は存在しない
# （日中足は1分足と5分足のみ）。1分足2本連続で代替する
vwap_break_bars = 2

# 高値・安値の切り下げ: 直近5分で3回連続
lower_high_low_count      = 3
lower_high_low_window_min = 5
# 何を「切り下げ1回」と数えるか。
#   "both"   … 高値(t) < 高値(t-1) かつ 安値(t) < 安値(t-1) を1回と数える
#   "either" … どちらか一方でも切り下がれば1回
#
# both のとき、片方だけ切り下がった足はカウントを維持する（リセットも増加もしない）。
# 両方が切り上がった足でカウントを0に戻す。
# 3回連続で両方が切り下がったときのみ点灯する。
lower_high_low_basis = "both"


# =============================================================================
# 地合い判定と配分（仕様書 第10章）  8:45に判定
# =============================================================================
[regime]
judge_time = "08:45"
min_symbols_if_trading = 3   # 建てる場合の下限。これを割るなら全見送り

[regime.bullish]
max_symbols    = 5
allocation_pct = 100

[regime.neutral]
max_symbols    = 4
allocation_pct = 70

[regime.bearish]
max_symbols    = 3
allocation_pct = 50
allow_skip_all = true   # 弱気なら「全見送り」を選べる


# =============================================================================
# データ鮮度ガード  ★最重要★
#   古い値を掴んだまま判定を走らせない。規定秒数を超えたら
#   その銘柄の判定を停止し #system へ即アラートする
# =============================================================================
[freshness]
# 各データ種別の許容鮮度（秒）。source 側のタイムスタンプ基準で測る
# [変更 2026-08-25] 45 → 150。**45秒は原理的に一度も通らなかった。**
#   株探の個別ページの時刻は分単位で、しかも「直近の確定した分」を返す。
#   実測: as_of=09:12:00 を 09:13:2x に取得 → age 82.9〜85.9秒。
#   構造上 age は 60〜120秒にしかならず、45秒では全銘柄が鮮度で落ちる。
#   1分足の上限(minute_bar_max_age_sec=150)と揃え、余裕を30秒持たせる。
quote_max_age_sec         = 150
minute_bar_max_age_sec    = 150   # 1分足（1分更新 × 2.5本ぶん）
daily_snapshot_max_age_h  = 30    # 前日バッチの日足スナップショット

# 連続失敗のしきい値。ここを超えたらポーリング自体を異常として扱う
consecutive_failure_alert = 2     # 2回連続で取得失敗したら #system へ
consecutive_failure_halt  = 4     # 4回連続で当該銘柄の判定を停止

# 立会時間外は鮮度チェックを行わない（大引け後に古くなるのは正常）
enforce_only_in_session = true

# 鮮度違反で判定停止した銘柄を自動再開するか
auto_resume_on_recovery = true
resume_requires_fresh_count = 2   # 連続2回フレッシュなデータが取れたら再開

# データ源の as_of がこの秒数以上「未来」なら拒否する。
# サーバ時計とのずれ、あるいはパース誤り（日付の取り違えなど）を検出する。
# 未来の時刻を「新鮮」として通すと、鮮度ガードそのものが無力化される。
clock_skew_tolerance_sec = 5.0


# =============================================================================
# ポーリング（仕様書 第1章「更新間隔」）
# =============================================================================
[polling]
quote_interval_sec      = 15   # 現在値・VWAP・累計売買代金・撤退シグナル
minute_bar_interval_sec = 60   # 1分足・トレール線計算
jitter_sec              = 2    # 同時リクエストを散らす
request_timeout_sec     = 10
retry_count             = 2
retry_backoff_sec       = 1.5


# =============================================================================
# データソース
# =============================================================================
[sources.jquants]
enabled  = true
base_url = "https://api.jquants.com/v2"
# 認証は x-api-key ヘッダ1本。V1 の refreshToken/idToken 方式は2026-06-01に終了
auth_header = "x-api-key"
api_key_env = "JQUANTS_API_KEY"

# プラン実測値（2026-08-24 時点）
#   日足   2006-08-24〜（20年 = Premium）
#   分足   2024-08-24〜（2年 = 分足アドオン）
rate_limit_per_min        = 500   # Premium
# 分足・ティックアドオンは別枠。公称は60/分だが、実測で60を指定すると429が頻発する
# （5営業日の計測中に13回、1回あたり65秒の待機で約14分を損失）。
# 429のペナルティのほうが高くつくため、少し下げて指定する。
minute_rate_limit_per_min = 45
request_timeout_sec       = 45
retry_count               = 3
retry_backoff_sec         = 2.0
retry_on_429_wait_sec     = 65    # 429 は分単位のため1分+α待つ

# 取引カレンダー /markets/calendar の休日区分(HolDiv)。公式の対応:
#   "0" 非営業日 / "1" 営業日 / "2" 東証半日立会日 / "3" 非営業日(祝日取引あり)
# "3" は祝日のデリバティブ取引を指し、現物株の立会はない。営業日に含めてはいけない。
# "2" は前場のみの立会日（大発会・大納会。2009年を最後に実施なし）で、現物の立会はある。
calendar_trading_day_codes = ["1", "2"]
# 前場のみの立会日。当日の大引けは 11:30 になる
calendar_half_day_codes    = ["2"]

# 日足の一括取得をディスクにキャッシュする。閾値の感度分析を回すたびに
# 40リクエストを投げ直さないため。確定した過去日のデータは変わらない。
cache_daily_bars    = true
# 分足もキャッシュする。出来高プロファイルの構築と判定の再現で同じ分足を
# 何度も引くため、共通化しないとアドオンのレート制限（45req/分）で律速する。
cache_minute_bars   = true
cache_ttl_days      = 400

# latest_trading_day() が「指定日以前で最も新しい営業日」を探すとき、
# 何暦日ぶん遡ってカレンダーを引くか。年末年始の連休を確実に跨げる長さにする。
latest_trading_day_lookback_days = 30

# 40営業日を確実に含む暦日範囲を作るときの余裕（日）。
# 土日で概ね1.4倍、さらに連休・年末年始を吸収する分を足す。
calendar_range_margin_days = 30

[sources.kabutan]
enabled  = true
base_url = "https://kabutan.jp"
# 内部CSVエンドポイント。チャートJS(/js/ch/kc_cf.js)の b.url="/stock/read" 由来
chart_path = "/stock/read"
# 足種の m パラメータ（実測）
ashi_daily   = 1
ashi_weekly  = 2
ashi_monthly = 3
ashi_1min    = 4
ashi_5min    = 5
ashi_yearly  = 6
# 価格は10倍固定小数で返る
price_scale = 10

stock_page_path = "/stock/"

# 複数銘柄の現在値を1リクエストでまとめて取る内部API（プレミアムのお気に入り画面由来）。
# POST /favorite/stock/ に codes[]=XXXX を並べると、全銘柄の
# 現在値・前日比・前日比% が1回で返る。実測で100銘柄を1リクエスト。
# 応答の kbtime がデータの時刻（鮮度判定に使う）、pmmode=1 がプレミアム配信の印。
bulk_quotes_path        = "/favorite/stock/"
bulk_quotes_max_symbols = 100
# pmmode がこの値でなければプレミアム配信になっていない（15分ディレイ）
bulk_quotes_premium_mode = 1
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

# プレミアムのログインセッション。secrets.env の KABUTAN_COOKIE から読む。
# 未ログインだと株価が15分ディレイになり、鮮度ガードが必ず発火する。
# セッションが切れたら「静かに古い値を掴む」のではなく、
# ディレイの増大として鮮度ガードが検出する（require_premium=true なら起動時にも検査）。
cookie_env      = "KABUTAN_COOKIE"
require_premium = true
# 未ログイン判定に使う目印。個別ページにこの文字列があれば無料版（15分ディレイ）
free_tier_marker = "株価15分ディレイ"
referer_template = "https://kabutan.jp/stock/chart?code={code}"

# 1リクエストあたりの最小間隔。実測で0.45秒間隔・8連続は問題なかったが余裕をみる
min_request_interval_sec = 0.5
request_timeout_sec      = 15
retry_count              = 2

# 1分足に売買代金がないため、出来高から按分して推定する
# J-Quantsの実測Vaと2,233バーで突合した結果、誤差の中央値0.000%・p99 0.162%
turnover_estimation = "typical_price"   # typical_price = (高値+安値+終値)/3 × 出来高
                                        # ohlc4 = (始+高+安+終)/4 × 出来高
                                        # close = 終値 × 出来高
# 個別銘柄ページの累計売買代金で日中の累積誤差を補正する
turnover_calibrate_with_cumulative = true
# 較正時、推定値と実測値の乖離がこの%を超えたら警告する。
# また1分足の出来高合計と個別ページの累計出来高がこの%を超えて食い違う場合、
# 2つのデータの時点がずれているとみなして較正を行わない
# （ずれた2つを混ぜて辻褄を合わせるのは静かに壊れる典型）。
turnover_calibration_warn_pct = 1.0
# 個別ページで「売買代金 ÷ 出来高」と VWAP の乖離がこの%を超えたら、
# 異なるブロック（PTS など）の値を混ぜて読んだとみなして解釈を中止する。
# PTS の値を東証の値として掴むと流動性判定が丸ごと壊れ、しかも PTS のほうが
# 時刻が新しいため鮮度ガードでは検出できない。
vwap_consistency_tolerance_pct = 2.0
# 429 を受けたときの待機秒数
retry_on_429_wait_sec = 30
retry_backoff_sec     = 1.0


# =============================================================================
# 通知（仕様書 第12章）
# =============================================================================
[notify]
backend = "slack"     # slack / stdout
# dry_run が true のときは backend によらず送信せずログにのみ出す。
# 実装が固まるまで、また立会時間外の試験では true にしておくこと。
dry_run = false
# 送信できなかったときに例外を上げるか。false ならログだけ残して続行する。
# 損切りアラートの不達は致命的なので既定は true。
raise_on_failure = true

[notify.slack]
bot_token_env = "SLACK_BOT_TOKEN"   # chat.update には Bot Token(xoxb-) が必須
api_base      = "https://slack.com/api"
# チャンネルは名前ではなくID(Cxxxxxxxx)。名前は改名で壊れる
channel_env_prefix = "SLACK_CHANNEL_"

# 保有ポジション一覧を1件だけ投稿し、同じメッセージを更新し続ける
# Slackはメッセージ編集ではプッシュ通知が飛ばない
position_board_enabled  = true
position_board_channel  = "alerts"
position_board_update_sec = 15
# Slackのレート制限は概ね1メッセージ/秒
min_api_interval_sec = 1.0

[notify.routes]
# 通知種別 → チャンネル名（secrets.env の SLACK_CHANNEL_<大文字> を引く）
#
# [変更 2026-08-25] **案B = 2チャンネル構成**を採用。
#   取引系はすべて alerts に集約し、システム障害だけ system に分離する。
#   仕様書§12 の5チャンネル案（案A）は、通知が分散しすぎて
#   「どこを見れば損切りが分かるか」が曖昧になるため見送った。
#   障害通知だけは分けないと、取引通知に埋もれて気づけない。
candidates    = "alerts"       # 9:30の候補通知
regime        = "alerts"       # 8:45の地合い判定
execution     = "alerts"       # 第3層クリア・執行
level_reached = "alerts"       # +1R / +1.5R / +2R / 損切り / 時間損切り
stop_switch   = "alerts"       # 9:45の損切りライン切り替え
force_exit    = "alerts"       # 強制手仕舞い
exit_signal   = "alerts"       # 撤退シグナル
report        = "alerts"       # 日次レポート
system        = "system"       # 取得失敗・パースエラー・データ鮮度異常 ★ここだけ分ける★


# =============================================================================
# ログ（仕様書 第13章）
# =============================================================================
[logging]
console_level = "INFO"
file_level    = "DEBUG"
# 判定の1件1件をJSONLで残す。どの条件を満たし/満たさず、なぜ候補入り/見送りかを追える
decision_journal = "data/journal/decisions.jsonl"
# 決済の記録。ルール由来か裁量由来かを必ず持たせる
trade_journal    = "data/journal/trades.jsonl"
# 取得したデータの生ログ。鮮度異常の事後調査用
fetch_journal    = "data/journal/fetches.jsonl"
rotate_daily     = true
retain_days      = 400          # Slack無料プランは履歴90日。運用記録はこちらに残す


# =============================================================================
# バックテスト（仕様書 第14章「実装前に検証すべき項目」）
# =============================================================================
[backtest]
# J-Quants の分足は2年、日足は20年遡及できる
minute_data_from = "2024-08-26"
default_from     = "2025-08-01"
default_to       = "2026-08-21"
# トレール vs +2R固定利確 の比較用
compare_fixed_target_r = 2.0
# 約定を保守的に見積もる。成行の想定スリッページ
slippage_ticks = 1
commission_bps = 0.0

# --- 約定価格モデル（docs/03_phase6_design.md 決定1）---
# 判定は足が確定した瞬間に出るので、実行できる最初の価格は「次の足の始値」。
#   A=楽観（判定価格そのもの） / B=現実的（次足始値±スリッページ） / C=最悪（次足の逆行端）
# 本命はBだが、**3つとも出力する**。AとCで結論が変わるならモデル依存であって実力ではない。
fill_model = "B"
# 仕様書§14「決済判定の粒度C」は15秒ティック前提だが、遡れるのは1分足だけ。
# 「足の安値が線を break_threshold_pct 以上下回った足は、その足で約定した」と近似する。
# 実測の下ヒゲ p90 = 0.300% と整合するが、★これは近似★であり運用開始後に実ティックと突合する。
intrabar_stop_approximation = true

# --- 銘柄選択（docs/03_phase6_design.md 決定2）---
# 8:45の地合い判定が未実装のため、仕様書§10の「中立」で固定して回す。
# 地合いを実装したら、ここではなく [regime] を見るように差し替えること。
max_positions = 4
# 同一セクター(33業種)の同時保有上限。
# ※仕様書に該当記述がなく、バックテスト限定の仮定としてここに置く。
#   本番の選択規則に入れるかは未決（docs/03_phase6_design.md 参照）。
max_per_sector = 2
# 候補が max_positions を超えた日の選択規則。
#   score_then_turnover = 第2層スコア降順 → 同点は20日平均売買代金の降順
# ※本番の想定規則（出来高急増率→ILLIQ→直近5分売買代金）とは異なる簡易版。
#   差異はバックテストの出力に明記する。
selection_rule = "score_then_turnover"

# --- 集計 ---
# R分布のバケット境界。両端は開区間として扱う
r_histogram_edges = [-2.0, -1.0, -0.5, 0.0, 0.5, 1.0, 2.0, 3.0]
# VWAP乖離の帯（%）。仕様書§14の「0〜+1% で入った回 vs +2〜+3% で入った回」を含む
vwap_bands_pct = [0.0, 1.0, 2.0, 3.0]
# 「即決済」の定義は exits.no_trail_minutes を流用する（トレール発動前に
# 損切りで終わった回）。ここに別の分数を置くと二重管理になり、片方が死ぬ。


# =============================================================================
# シンプル・ピックアップ（tools/pick.py）
#   株探のランキングから拾い、株価と売買代金だけで絞る。日毎の統計計算はしない。
# =============================================================================
[pick]
price_min        = 600      # 株価の下限（円）
price_max        = 4000     # 株価の上限（円）
turnover_min_oku = 50       # 当日の累計売買代金の下限（億円）
# 日経平均の前日比で銘柄数を決める（仕様書§10 の簡略版）
bullish_pct      = 0.5      # これ以上なら強気
bearish_pct      = -0.5     # これ以下なら弱気
symbols_bullish  = 5
symbols_neutral  = 5
symbols_bearish  = 3
# 損切り・利確は買値からの固定%（仕様書§6-3 のリスクリワード 1:2 を満たす）
# 通知した時刻がそのままチャートのマーカーになる
stop_pct   = 2.0     # 買値から −2%
target_pct = 4.0     # 買値から +4%（1:2）
